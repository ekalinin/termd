<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>termd</title>
<meta name="description" content="{{.Description}}">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<h1>termd</h1>
<p class="tagline">{{.Description}}</p>
<div class="actions">
<pre class="install"><span class="prompt" aria-hidden="true">$ </span><code>{{.Install}}</code></pre>
<a class="github" href="{{.Repo}}"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
</div>
<p class="release"><a href="{{.Release}}"><img src="{{.Badge}}" alt="Latest release"></a></p>
</header>
<nav class="controls">
<div class="group" role="radiogroup" aria-label="Width">
<span class="label">Width</span>
<div class="seg">
{{range .Widths}}<input type="radio" name="width" id="width-{{.}}"{{if eq . $.DefaultWidth}} checked{{end}}><label for="width-{{.}}">{{.}}</label>
{{end}}</div>
</div>
<div class="group" role="radiogroup" aria-label="Theme">
<span class="label">Theme</span>
<div class="seg">
<input type="radio" name="theme" id="theme-auto" checked><label for="theme-auto">auto</label>
<input type="radio" name="theme" id="theme-light"><label for="theme-light">light</label>
<input type="radio" name="theme" id="theme-dark"><label for="theme-dark">dark</label>
</div>
</div>
</nav>
<main>
{{range .Examples}}{{$file := .File}}<section class="example" id="{{.Name}}">
{{range .Widths}}{{$cols := .Cols}}<div class="cols-{{$cols}}">
{{range .Fragments}}<figure class="window{{with .Theme}} {{.}}{{end}}">
<figcaption class="titlebar"><span class="prompt" aria-hidden="true">$</span> termd --width {{$cols}}{{with .Theme}} --theme {{.}}{{end}} {{$file}}</figcaption>
<div class="screen">
<div class="ruler" aria-hidden="true">{{ruler $cols}}</div>
<pre class="term">{{.HTML}}</pre>
</div>
</figure>
{{end}}</div>
{{end}}</section>
{{end}}</main>
<footer>
<a href="{{.Repo}}">GitHub</a>
<a href="{{.License}}">MIT License</a>
</footer>
</body>
</html>
